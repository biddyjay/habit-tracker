function getPeriodKey(h) {
  if (h.freq === "weekly")  return h.id + "_W" + getWeekKey();
  if (h.freq === "monthly") return h.id + "_M" + getMonthKey();
  return h.id + "_" + getLocalDate();
}
function getWeekKey() {
  var d = new Date(), s = new Date(d.getFullYear(), 0, 1);
  return d.getFullYear() + "W" + Math.ceil(((d - s) / 86400000 + s.getDay() + 1) / 7);
}
function getMonthKey() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function isVisibleToday(h) {
  if (h.freq === "daily")   return true;
  if (h.freq === "weekly")  return h.dow === undefined || h.dow === TODAY_DOW;
  if (h.freq === "monthly") return h.dom === undefined || h.dom === TODAY_DOM;
  return true;
}
function isUrl(t) { try { new URL(t); return true; } catch(e) { return false; } }

// Private progress model: one document per dated habit, never one shared JSON blob.
function localDate(date = new Date(), timeZone = 'Asia/Dubai') {
  const parts = new Intl.DateTimeFormat('en-CA', {timeZone, year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(date);
  const get = kind => parts.find(p => p.type === kind).value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}
function previousDate(day) {
  const d = new Date(day + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() - 1);
  return d.toISOString().slice(0, 10);
}
function periodKey(habit, day) {
  if (habit.freq !== 'weekly') return day;
  const d = new Date(day + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d.toISOString().slice(0, 10);
}
function completion(habit, record = {}) {
  if (habit.multiCheck) return habit.multiCheck.every(item => (record.items || []).includes(item));
  if (habit.slider) return Number(record.quantity || 0) >= 1000;
  return record.done === true;
}
function makeRecord(habit, day, change, source = 'app') {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) throw new Error('An explicit date is required');
  const record = {habitId:habit.id, date:day, period:periodKey(habit, day), ...change, source};
  record.done = completion(habit, record);
  return record;
}
function stats(habit, records, today) {
  const dates = [...new Set(records.filter(r => r.habitId === habit.id && completion(habit,r)).map(r => r.period))].sort().reverse();
  let streak = 0;
  let cursor = habit.freq === 'weekly' ? periodKey(habit,today) : today;
  const back = day => {
    if (habit.freq !== 'weekly') return previousDate(day);
    const d = new Date(day + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() - 7);
    return d.toISOString().slice(0,10);
  };
  if (!dates.includes(cursor)) cursor = back(cursor);
  while(dates.includes(cursor)) { streak++; cursor = back(cursor); }
  return {streak, total:dates.length, yearTotal:dates.filter(day => day.slice(0,4) === today.slice(0,4)).length};
}

 return <main style={{maxWidth:520,margin:'0 auto',minHeight:'100vh',padding:12,color:'#17191C',background:'#fff'}}>
  <header style={{padding:'8px 2px 14px'}}><div style={{color:'#0A8F89',fontSize:10,letterSpacing:2}}>DAILY SYSTEM</div><h1 style={{fontSize:24}}>Habit Tracker</h1><div style={{fontSize:12,color:'#68727A',marginTop:6}}>{day} · Dubai time</div></header>
  {!cloud.user?<section style={{border:'1px solid #E6E8EB',padding:18,borderRadius:12}}><h2 style={{fontSize:18,marginBottom:10}}>Your private progress</h2><p style={{fontSize:14,lineHeight:1.5,marginBottom:16}}>Sign in once to see the same progress on your phone and from confirmed updates in our chat. Previous browser history is left untouched and is not imported.</p><form onSubmit={login}><label>Email<input style={style} name="email" type="email" autoComplete="username" required/></label><label>Tracker password<input style={style} name="password" type="password" autoComplete="current-password" required/></label><button style={{...style,background:'#0A8F89',color:'white',fontWeight:700}} disabled={!sdk||busy}>{busy?'Signing in…':sdk?'Sign in':'Loading secure sign-in…'}</button></form><small>Use your new tracker password, not your Google password.</small></section>:<>
  <div role="status" style={{padding:10,borderRadius:8,background:'#F0F8F7',fontSize:12,marginBottom:10}}>{cloud.error?cloud.error:!cloud.ready?'Connecting to private progress…':cloud.pending?'Saving changes…':'Private progress synced'} <button style={{float:'right',border:0,background:'transparent',fontSize:11}} onClick={()=>window.HabitCloud.logout()}>Sign out</button></div>
  <p style={{fontSize:12,lineHeight:1.5,color:'#68727A',marginBottom:12}}>Tell me in our chat when a habit is done. No need to enter it twice. Old local history has not been imported.</p>
  {cloud.ready&&<><div style={{fontSize:12,marginBottom:5}}>Daily progress: {count}/{daily.length}</div><div role="progressbar" aria-label="Daily progress" aria-valuenow={count} aria-valuemin="0" aria-valuemax={daily.length} style={{height:5,background:'#E6E8EB',borderRadius:4,marginBottom:12}}><div style={{width:(count/daily.length*100)+'%',height:'100%',background:'#12B3AC',borderRadius:4}}/></div>
  <nav style={{display:'flex',gap:2,borderBottom:'1px solid #E6E8EB',marginBottom:12}}>{TIME_TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'10px 0',fontSize:9,border:0,borderBottom:tab===t.id?'2px solid #12B3AC':'2px solid transparent',background:'white',color:tab===t.id?'#078B85':'#68727A'}}>{t.label}</button>)}</nav>
  {tab==='weekly'&&<p style={{fontSize:12,marginBottom:10}}>Weekly habits can be completed any day this week. Weeks run Monday to Sunday.</p>}
  {tab==='goals'?<PrivateGoals cloud={cloud} save={save}/>:visible.map(h=>{const s=stats(h,records,day);return <HabitItem key={h.id} habit={h} done={done(h)} streak={s.streak} total={s.yearTotal} tabColor="#12B3AC" showCat={tab==='all'} note={cloud.notes[h.id]?.text??h.defaultNote??''} onSaveNote={text=>save('notes',h.id,{text})} qty={current(h).quantity||0} onQty={quantity=>change(h,{quantity})} multiSel={current(h).items||[]} onMultiSel={items=>change(h,{items})} onToggle={()=>toggle(h)}/>;})}
  <details style={{marginTop:24,fontSize:12,color:'#68727A'}}><summary>Connection check</summary><p style={{margin:'10px 0'}}>A connection test writes a separate test marker. It never ticks a habit or changes your progress.</p><button onClick={async()=>{const marker=Date.now().toString();if(await save('diagnostics','connection',{marker}))setDiagnostic(marker);}}>Run connection test</button><p>{diagnostic&&cloud.diagnostics.connection?.marker===diagnostic?'Connection test synced.':''}</p><p>Last test: {cloud.diagnostics.connection?.marker||'None'}</p></details>
  </>}
  </>}
  {(error||cloud.error)&&<p role="alert" style={{padding:12,color:'#A62929',fontSize:14}}>{error||cloud.error}</p>}
  <footer style={{fontSize:11,color:'#68727A',padding:'24px 0'}}>Fresh tracking · Your saved progress is private.</footer>
 </main>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
